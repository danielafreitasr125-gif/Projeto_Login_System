<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN SYSTEM</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="login-container">
   <!-- div principal de login  
    a classe login container é usada no css
   -->

   <h1> login</h1>
   <!-- titulo principal da pagina -->
    <p>Acesse sua conta</p>
    <!-- paragrafos é para textos auxiliares de instruçoes para usuarios -->

    <form >
        <div class="input-group">
            <!-- é a div que agrupa o label(titulo) e o input  -->
             <label for="email">Email</label>
             <input id="email" type="email" placeholder="Digite seu email">
             <label for="Senha">Senha</label>
             <input id="senha" type="password" placeholder="digite sua senha">

             <button type="submit">Entrar</button>

        </div>
    </form>
        <div class="footer">
            <span>Nao tem conta?</span>
            <a href="./register.html">Criar conta</a>
        </div>
    </div>
</body>
</html>
